<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b16">
  <title>Lauren's Science Quest</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #070b16;
      --panel: rgba(13, 20, 37, .88);
      --line: rgba(159, 181, 224, .16);
      --text: #eef3ff;
      --muted: #9aa7c1;
      --cyan: #7ee7f5;
      --violet: #b39cff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 42%, rgba(82, 111, 190, .24), transparent 28%),
        radial-gradient(circle at 58% 78%, rgba(126, 231, 245, .08), transparent 18%),
        var(--page);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, .8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(126, 231, 245, .55) 0 1px, transparent 1.5px);
      background-position: 0 0, 38px 52px;
      background-size: 96px 96px, 137px 137px;
      opacity: .42;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 34px 22px 24px;
      border-right: 1px solid var(--line);
      background: rgba(7, 11, 22, .72);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin: 0 10px 32px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .nav-label {
      margin: 0 10px 10px;
      color: #73809b;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .science-nav {
      display: grid;
      gap: 8px;
    }

    .science-link {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 66px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .science-link:hover,
    .science-link:focus-visible {
      border-color: var(--line);
      background: rgba(255, 255, 255, .04);
      transform: translateX(3px);
      outline: none;
    }

    .science-link.active {
      border-color: rgba(126, 231, 245, .18);
      background: linear-gradient(110deg, rgba(126, 231, 245, .09), rgba(255, 255, 255, .025));
    }

    .nav-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .035);
      font-size: 19px;
    }

    .nav-copy {
      min-width: 0;
    }

    .nav-title,
    .nav-detail {
      display: block;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 650;
      line-height: 1.25;
    }

    .nav-detail {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    main {
      min-width: 0;
      height: 100vh;
      padding: 0;
    }

    #science-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--page);
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        padding: 18px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        margin-bottom: 16px;
      }

      .science-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      main {
        height: calc(100vh - 174px);
      }
    }

    @media (max-width: 480px) {
      .science-nav {
        grid-template-columns: 1fr;
      }

      main {
        height: calc(100vh - 242px);
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="page">
    <aside class="sidebar" aria-label="Science pages">
      <p class="brand">Lauren's Science Quest</p>
      <p class="nav-label">Explore</p>
      <nav class="science-nav">
        <a class="science-link active" href="earth-moon-sun.html" data-page="earth-moon-sun.html" aria-current="page">
          <span class="nav-icon" aria-hidden="true">☀️</span>
          <span class="nav-copy">
            <span class="nav-title">Earth, Moon &amp; Sun</span>
            <span class="nav-detail">Orbital explorer</span>
          </span>
        </a>
        <a class="science-link" href="https://mikhaild908.github.io/space-quiz/index.html" data-page="https://mikhaild908.github.io/space-quiz/index.html">
          <span class="nav-icon" aria-hidden="true">🚀</span>
          <span class="nav-copy">
            <span class="nav-title">Space Quiz</span>
            <span class="nav-detail">Test your knowledge</span>
          </span>
        </a>
      </nav>
    </aside>

    <main>
      <iframe
        id="science-frame"
        title="Science Quest page"
        src="earth-moon-sun.html"
      ></iframe>
    </main>
  </div>

  <script>
    const frame = document.querySelector("#science-frame");
    const links = document.querySelectorAll(".science-link");

    links.forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();

        links.forEach((item) => {
          item.classList.remove("active");
          item.removeAttribute("aria-current");
        });

        link.classList.add("active");
        link.setAttribute("aria-current", "page");
        frame.src = link.dataset.page;
        frame.title = link.querySelector(".nav-title").textContent;
      });
    });
  </script>
</body>
</html>
